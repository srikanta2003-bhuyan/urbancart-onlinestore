<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - UrbanCart</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <div class="navbar">
        <div class="logo">
            <a href="index.html"><img src="images/logo.urbancart.jpeg" width="125px"></a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="product.html">Products</a></li>
                <li><a href="account.html">Account</a></li>
            </ul>
        </nav>
    </div>
</div>

<div class="small-container">
    <h2>Checkout</h2>

    <!-- PRODUCT DETAILS -->
    <div id="productDetails" style="margin-bottom:20px;"></div>

    <form id="checkoutForm">
        <input type="text" id="fullName" placeholder="Full Name" required><br><br>
        <input type="text" id="address" placeholder="Address" required><br><br>
        <input type="text" id="city" placeholder="City" required><br><br>
        <input type="text" id="pincode" placeholder="Pincode" required><br><br>

        <h3>Payment Method</h3>
        <select id="payment">
            <option>Cash on Delivery</option>
            <option>UPI</option>
            <option>Card</option>
        </select><br><br>

        <button class="btn">Place Order</button>
    </form>
</div>

<script>
// 🔒 LOGIN CHECK
if (!localStorage.getItem("user")) {
    alert("Please login first");
    window.location.href = "account.html";
}

// 📦 GET PRODUCT
const product = JSON.parse(localStorage.getItem("buyNowProduct"));

// SHOW PRODUCT
if (product) {
    document.getElementById("productDetails").innerHTML = `
        <h3>Product: ${product.name}</h3>
        <p>Price: ₹${product.price}</p>
        <p>Quantity: ${product.quantity}</p>
        <p><strong>Total: ₹${product.price * product.quantity}</strong></p>
    `;
} else {
    document.getElementById("productDetails").innerHTML = `<p>No product selected</p>`;
}

// 🧾 PLACE ORDER (MongoDB)
document.getElementById("checkoutForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const order = {
        user: JSON.parse(localStorage.getItem("user")),
        product: product,
        address: document.getElementById("address").value,
        city: document.getElementById("city").value,
        pincode: document.getElementById("pincode").value,
        payment: document.getElementById("payment").value
    };

    try {
        const res = await fetch("http://localhost:3000/api/orders", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(order)
        });

        const data = await res.json();

        alert(data.message || "Order Placed Successfully!");

        // clear product
        localStorage.removeItem("buyNowProduct");

        // ✅ redirect to home
        window.location.href = "index.html";

    } catch (err) {
        console.log(err);
        alert("Error placing order");
    }
});
</script>

</body>
</html>
